<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Manajemen Pekerja, Dokumentasi & Akuntansi Proyek</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Pengaturan Khusus Saat Dicetak ke PDF / Printer */
        @media print {
            body { background-color: #ffffff !important; color: #000000 !important; padding-bottom: 0 !important; }
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            .print-box { border: 1px solid #000 !important; box-shadow: none !important; background: #fff !important; color: #000 !important; }
            table { width: 100% !important; border-collapse: collapse !important; }
            th, td, th *, td * { color: #000000 !important; border-color: #333333 !important; }
            th, td { border: 1px solid #333 !important; padding: 6px !important; font-size: 11px !important; vertical-align: middle !important; }
            .foto-tabel { width: 110px !important; height: 75px !important; object-fit: cover !important; border: 1px solid #666 !important; }
        }
        .print-only { display: none; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans pb-24 md:pb-12">

    <!-- ========================================================= -->
    <!-- [01] HEADER ATAS & TOMBOL CETAK PDF                       -->
    <!-- ========================================================= -->
    <header class="no-print bg-slate-950 border-b border-amber-500/40 sticky top-0 z-40 shadow-lg">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-3">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-lg bg-amber-500 text-slate-950 flex items-center justify-center font-black text-xl">
                    <i class="fa-solid fa-helmet-safety"></i>
                </div>
                <div>
                    <h1 class="font-extrabold text-base sm:text-lg text-white leading-tight">SISTEM MANAJEMEN PROYEK & AKUNTANSI</h1>
                    <p class="text-xs text-amber-400">Input HP & Monitoring PC • Proteksi Sandi PIN 4 Digit</p>
                </div>
            </div>

            <!-- Menu Action Atas -->
            <div class="flex flex-wrap items-center gap-2">
                <button onclick="window.cetakLaporanPDF()" class="bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-xs sm:text-sm px-3.5 py-2 rounded-lg flex items-center gap-1.5 shadow cursor-pointer">
                    <i class="fa-solid fa-file-pdf"></i> Cetak Semua (PDF)
                </button>
                <button onclick="window.exportBackupData()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-600 font-bold text-xs px-3 py-2 rounded-lg flex items-center gap-1 cursor-pointer" title="Simpan File Data untuk Pindah HP ke PC">
                    <i class="fa-solid fa-download text-amber-400"></i> Backup
                </button>
                <label class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-600 font-bold text-xs px-3 py-2 rounded-lg flex items-center gap-1 cursor-pointer" title="Muat File Data dari HP/PC">
                    <i class="fa-solid fa-upload text-emerald-400"></i> Muat Data
                    <input type="file" accept=".json" onchange="window.importBackupData(event)" class="hidden">
                </label>
            </div>
        </div>
    </header>

    <!-- ========================================================= -->
    <!-- [02] KOP SURAT KHUSUS SAAT PRINT / EXPORT PDF             -->
    <!-- ========================================================= -->
    <div class="print-only max-w-7xl mx-auto px-6 pt-4 pb-3 border-b-2 border-black mb-4">
        <div class="flex justify-between items-center">
            <div>
                <h1 id="judul-kop-print" class="text-lg font-black uppercase">LAPORAN MANAJEMEN PEKERJAAN, UPAH & AKUNTANSI KEUANGAN</h1>
                <p class="text-xs">Rekapitulasi Resmi Biaya Tenaga Kerja, Dokumentasi Pekerjaan, Bahan Material & Kas Proyek</p>
            </div>
            <div class="text-right text-xs">
                <p><strong>Tanggal Cetak:</strong> <span id="tgl-cetak-pdf"></span></p>
                <p><strong>Status Dokumen:</strong> Terverifikasi Sistem</p>
            </div>
        </div>
    </div>

    <!-- ========================================================= -->
    <!--
